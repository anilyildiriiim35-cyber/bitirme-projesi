<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Urban POS - Gün Sonu Raporu</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- =========================================
     NAVBAR
========================================= -->

<nav class="navbar navbar-expand-lg navbar-dark custom-navbar fixed-top shadow">

    <div class="container-fluid">

        <a class="navbar-brand fw-bold text-warning"
           href="index.html">

            🍽 Urban POS

        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse"
             id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link"
                       href="index.html">

                        Ana Sayfa

                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="menu.html">

                        Menü

                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="tables.html">

                        Masalar

                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="order.html">

                        Sipariş

                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active"
                       href="report.html">

                        Gün Sonu

                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="products.html">

                        Ürün Yönetimi

                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>


<!-- =========================================
     CONTENT
========================================= -->

<div class="container py-5 mt-5">

    <!-- =========================================
         RAPOR KARTI
    ========================================== -->

    <div class="report-card">

        <!-- HEADER -->

        <div class="d-flex
                    flex-column
                    flex-lg-row
                    justify-content-between
                    align-items-lg-center
                    gap-3
                    mb-4">

            <h2 class="text-warning mb-0">

                📊 Gün Sonu Raporu

            </h2>

            <!-- TARİH -->

            <div class="d-flex flex-column flex-sm-row gap-2">

                <input
                    type="date"
                    id="tarihSecici"
                    class="form-control">

                <button
                    class="btn btn-warning"
                    onclick="tariheGoreFiltrele()">

                    Sorgula

                </button>

            </div>

        </div>


        <!-- =========================================
             TABLO
        ========================================== -->

        <div class="table-responsive">

            <table class="table table-dark table-hover align-middle">

                <thead>

                    <tr>

                        <th>Saat</th>

                        <th>Masa</th>

                        <th>Ödeme</th>

                        <th>Tutar</th>

                    </tr>

                </thead>

                <tbody id="raporTablosu">

                </tbody>

            </table>

        </div>


        <!-- =========================================
             TOPLAM
        ========================================== -->

        <div class="mt-4
                    d-flex
                    flex-column
                    flex-sm-row
                    justify-content-between
                    align-items-sm-center
                    gap-2
                    border-top
                    pt-3">

            <h4 class="mb-0">

                Toplam Ciro:

            </h4>

            <h3 class="text-warning mb-0"
                id="toplamCiro">

                0 ₺

            </h3>

        </div>

    </div>


    <!-- =========================================
         ANALİZLER
    ========================================== -->

    <div class="row g-4 mt-4">

        <!-- EN ÇOK SATAN -->

        <div class="col-12 col-lg-6">

            <div class="analiz-card h-100">

                <h6>

                    🔥 En Çok Satılan Ürün

                </h6>

                <h3 id="enCokSatanUrun">

                    Veri Yok

                </h3>

                <small id="enCokSatanAdet">

                    0 adet

                </small>

            </div>

        </div>


        <!-- ÖDEME DAĞILIMI -->

        <div class="col-12 col-lg-6">

            <div class="analiz-card h-100">

                <h6>

                    💳 Ödeme Dağılımı

                </h6>

                <div class="progress mt-3">

                    <div id="nakitBar"
                         class="progress-bar bg-success">

                    </div>

                    <div id="kartBar"
                         class="progress-bar bg-primary">

                    </div>

                </div>

                <small class="d-block mt-3">

                    🟢 Nakit:
                    <span id="nakitYuzde">

                        0

                    </span>

                    <br>

                    🔵 Kart:
                    <span id="kartYuzde">

                        0

                    </span>

                </small>

            </div>

        </div>

    </div>


    <!-- =========================================
         BUTTONS
    ========================================== -->

    <div class="mt-5
                d-flex
                flex-column
                flex-md-row
                gap-3
                justify-content-between">

        <button class="btn btn-secondary"
                onclick="window.location.href='order.html'">

            ⬅ Siparişe Dön

        </button>

        <button class="btn btn-danger"
                onclick="temizle()">

            Tüm Verileri Sıfırla

        </button>

    </div>

</div>


<!-- =========================================
     JS
========================================= -->

<script src="storage.js"></script>

<script src="report.js"></script>

<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
