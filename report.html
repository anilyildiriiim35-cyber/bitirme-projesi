<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Urban POS - Gün Sonu Raporu</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>
<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark custom-navbar fixed-top shadow">

  <div class="container-fluid">

    <a class="navbar-brand fw-bold text-warning" href="index.html">
      🍽 Urban POS
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">

      <ul class="navbar-nav ms-auto">

        <li class="nav-item"><a class="nav-link" href="index.html">Ana Sayfa</a></li>
        <li class="nav-item"><a class="nav-link" href="menu.html">Menü</a></li>
        <li class="nav-item"><a class="nav-link" href="tables.html">Masalar</a></li>
        <li class="nav-item"><a class="nav-link" href="order.html">Sipariş</a></li>
        <li class="nav-item"><a class="nav-link" href="report.html">Gün Sonu</a></li>
        <li class="nav-item"><a class="nav-link active" href="products.html">Ürün Yönetimi</a></li>

      </ul>

    </div>

  </div>

</nav>  


<!-- ========================= -->
<!-- 📊 CONTENT -->
<!-- ========================= -->
<div class="container pt-5 mt-5">

    <div class="report-card">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h2 class="text-warning mb-0">
                📊 Gün Sonu Raporu
            </h2>

            <div class="d-flex gap-2">

                <input type="date" id="tarihSecici" class="form-control">

                <button class="btn btn-warning" onclick="tariheGoreFiltrele()">
                    Sorgula
                </button>

            </div>

        </div>


        <!-- TABLO -->
        <div class="table-responsive">

            <table class="table table-dark table-hover">

                <thead>
                    <tr>
                        <th>Saat</th>
                        <th>Masa</th>
                        <th>Ödeme</th>
                        <th>Tutar</th>
                    </tr>
                </thead>

                <tbody id="raporTablosu"></tbody>

            </table>

        </div>


        <!-- TOPLAM -->
        <div class="mt-4 d-flex justify-content-between border-top pt-3">

            <h4>Toplam Ciro:</h4>

            <h3 class="text-warning" id="toplamCiro">0 ₺</h3>

        </div>

    </div>


    <!-- ANALİZ -->
    <div class="row mt-4">

        <div class="col-md-6">
            <div class="analiz-card">
                <h6>🔥 En Çok Satılan Ürün</h6>
                <h3 id="enCokSatanUrun">Veri Yok</h3>
                <small id="enCokSatanAdet">0 adet</small>
            </div>
        </div>

        <div class="col-md-6">
            <div class="analiz-card">
                <h6>💳 Ödeme Dağılımı</h6>

                <div class="progress mt-2">
                    <div id="nakitBar" class="progress-bar bg-success"></div>
                    <div id="kartBar" class="progress-bar bg-primary"></div>
                </div>

                <small class="d-block mt-2">
                    🟢 Nakit: <span id="nakitYuzde">0</span>%
                    🔵 Kart: <span id="kartYuzde">0</span>%
                </small>

            </div>
        </div>

    </div>


    <!-- BUTONLAR -->
    <div class="mt-5 d-flex justify-content-between">

        <button class="btn btn-secondary"
                onclick="window.location.href='order.html'">

            ⬅ Siparişe Dön

        </button>

        <button class="btn btn-danger" onclick="temizle()">
            Tüm Verileri Sıfırla
        </button>

    </div>

</div>


<!-- JS -->
 
<script src="storage.js"></script>
<script src="report.js"></script>

<!-- BOOTSTRAP JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
