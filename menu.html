    background:#1b1b1b;
    border:1px solid #333;

    border-radius:10px;
    padding:10px;
}
</style>
</head>

<body class="p-4">

  <div class="container-fluid">

    <!-- LOGO -->

    <!-- MOBİL BUTON -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>

    <!-- MENÜ -->
    <div class="collapse navbar-collapse" id="navbarNav">

      <ul class="navbar-nav ms-auto align-items-center">

<div class="container">

<h2 class="text-warning mb-3">MENÜ</h2>


<input 
id="search" 
class="form-control search-box mb-3" 
placeholder="Ürün ara..." 
onkeyup="searchMenu()">


<div class="mb-3">
    <button class="btn btn-warning btn-filter" onclick="filter('hepsi')">Hepsi</button>
    <button class="btn btn-danger btn-filter" onclick="filter('kirmizi')">Kırmızı Et</button>
    <button class="btn btn-primary btn-filter" onclick="filter('beyaz')">Beyaz Et</button>
    <button class="btn btn-success btn-filter" onclick="filter('meze')">Meze</button>
    <button class="btn btn-info btn-filter" onclick="filter('icecek')">İçecek</button>
</div>

<div class="row" id="menu"></div>

</div>

<script>

let allProducts = [];

function getProducts(){
    return JSON.parse(localStorage.getItem("urban_products")) || [];
}

function render(list){
    let html = "";

    list.forEach(u=>{
        if(!u.inStock) return;

        html += `
        <div class="col-md-3 mb-3">
            <div class="card p-3 text-center">
                <h5>${u.name}</h5>
                <b class="text-warning">${u.price} ₺</b>
                <small class="text-secondary">${u.category}</small>
            </div>
        </div>`;
    });

    document.getElementById("menu").innerHTML = html;
}


function filter(type){
    let data = allProducts;

    if(type !== "hepsi"){
        data = data.filter(x => x.category === type);
    }

    render(data);
}


function searchMenu(){
    let q = document.getElementById("search").value.toLowerCase();

    let filtered = allProducts.filter(x =>
        x.inStock &&
        x.name.toLowerCase().includes(q)
    );

    render(filtered);
}


allProducts = getProducts();
render(allProducts);

</script>

</body>
