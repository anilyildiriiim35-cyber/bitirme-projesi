<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<link rel="stylesheet" href="style.css">
</head>

<body class="p-4">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top shadow"
style="background: linear-gradient(90deg,#0f0f0f,#1c1c1c); border-bottom:2px solid #ffc107;">

  <div class="container-fluid">

    <a class="navbar-brand fw-bold text-warning" href="index.html">
      🍽 Urban POS
    </a>

    <div class="collapse navbar-collapse">

      <ul class="navbar-nav ms-auto">

        <li class="nav-item"><a class="nav-link" href="index.html">Ana Sayfa</a></li>
        <li class="nav-item"><a class="nav-link" href="menu.html">Menü</a></li>
        <li class="nav-item"><a class="nav-link" href="tables.html">Masalar</a></li>
        <li class="nav-item"><a class="nav-link" href="order.html">Sipariş</a></li>
        <li class="nav-item"><a class="nav-link" href="report.html">Gün Sonu</a></li>
        <li class="nav-item"><a class="nav-link" href="products.html">Ürün Yönetimi</a></li>

      </ul>

    </div>
  </div>
</nav>

<br><br><br>

<div class="container">

  <h3 class="mb-3">🍽 Ürün Yönetimi</h3>

  <!-- ÜRÜN EKLE -->
  <div class="card p-3 mb-4">

    <div class="row g-2">

      <div class="col-md-3">
        <input id="ad" class="form-control" placeholder="Ürün adı">
      </div>

      <div class="col-md-2">
        <input id="fiyat" type="number" class="form-control" placeholder="Fiyat">
      </div>

      <div class="col-md-3">
        <select id="kat" class="form-select">
          <option value="kirmizi">Kırmızı Et</option>
          <option value="beyaz">Beyaz Et</option>
          <option value="meze">Meze</option>
          <option value="icecek">İçecek</option>
        </select>
      </div>

      <div class="col-md-2">
        <input id="stok" type="number" class="form-control" placeholder="Stok">
      </div>

      <div class="col-md-2">
        <button class="btn btn-warning w-100" onclick="ekle()">Ekle</button>
      </div>

    </div>
  </div>

  <!-- TABLO -->
  <div class="card p-3">

    <table class="table table-dark table-hover">

      <thead>
        <tr>
          <th>Ürün</th>
          <th>Fiyat</th>
          <th>Kategori</th>
          <th>Stok</th>
          <th>İşlem</th>
        </tr>
      </thead>

      <tbody id="liste"></tbody>

    </table>

  </div>

</div>

<!-- JS -->
<script src="storage.js"></script>
<script src="products.js"></script>

</body>
</html>
