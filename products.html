rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

========================================= -->

    <div class="container-fluid">

        <a class="navbar-brand fw-bold text-warning"
           href="index.html">

            🍽 Urban POS

        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse"
             id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link"
                       href="index.html">

                        Ana Sayfa

                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="menu.html">

                        Menü

                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="tables.html">

                        Masalar

                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="order.html">

                        Sipariş

                    </a>
                </li>

                       href="report.html">

                        Gün Sonu

                       href="products.html">

                        Ürün Yönetimi

                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>


<!-- =========================================
     PAGE
========================================= -->

<div class="container py-5 mt-5">

    <!-- BAŞLIK -->

    <div class="row mb-4">

        <div class="col-12">

            <h3 class="text-warning">

                🍽 Ürün Yönetimi

            </h3>

        </div>

    </div>


    <!-- =========================================
         ÜRÜN EKLE
    ========================================== -->

    <div class="card p-4 mb-4">

        <div class="row g-3">

            <!-- ÜRÜN ADI -->

            <div class="col-12 col-md-3">

                <input
                    id="ad"
                    class="form-control"
                    placeholder="Ürün adı">

            </div>


            <!-- FİYAT -->

            <div class="col-12 col-md-2">

                <input
                    id="fiyat"
                    type="number"
                    class="form-control"
                    placeholder="Fiyat">

            </div>


            <!-- KATEGORİ -->

            <div class="col-12 col-md-3">

                <select
                    id="kat"
                    class="form-select">

                    <option value="">

                        Kategori Seç

                    </option>

                </select>

            </div>


            <!-- STOK -->

            <div class="col-12 col-md-2">

                <input
                    id="stok"
                    type="number"
                    class="form-control"
                    placeholder="Stok">

            </div>


            <!-- BUTTON -->

            <div class="col-12 col-md-2">

                <button
                    class="btn btn-warning w-100 h-100"
                    onclick="ekle()">

                    Ekle

                </button>

            </div>

        </div>

    </div>


    <!-- =========================================
         TABLO
    ========================================== -->

    <div class="card p-3">

        <div class="table-responsive">

            <table class="table table-dark table-hover align-middle">

                <thead>

                    <tr>

                        <th>Ürün</th>

                        <th>Fiyat</th>

                        <th>Kategori</th>

                        <th>Stok</th>

                        <th>İşlem</th>

                    </tr>

                </thead>

                <tbody id="liste">

                </tbody>

            </table>

        </div>

    </div>

</div>


<!-- =========================================
     JS
========================================= -->

<script src="storage.js"></script>

<script src="products.js"></script>

<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
